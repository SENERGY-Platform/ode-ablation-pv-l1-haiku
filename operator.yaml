# The operator as the analytics stack registers it (§5.14).
#
# ODE offers registration as an explicit action and never performs it on its own,
# so this file is the payload that action sends. Edit it here; it is the source of
# truth for what the pipeline editor will show.
name: ode-ablation-pv-l1-haiku
description: An ODE-developed analytics operator
image: ghcr.io/senergy-platform/ode-ablation-pv-l1-haiku:latest

# Public makes the operator visible to other users of the platform. Registration
# is a developer decision and so is this.
pub: false
deploymentType: local

# What the pipeline editor offers as inputs. "name" has to match a selector arg in
# op.py — the two together are how a message reaches infer().
#
#   value     the inverter's total AC power, W (device topic)
#   cloud_fc  yr.no forecast cloud cover, % for a forecast hour (import topic)
#   forecasted_for  the hour that forecast value is about (import topic)
#   cloud_obs open-meteo observed cloud cover, % (import topic; training only)
inputs:
  - name: value
    type: float
  - name: cloud_fc
    type: float
  - name: forecasted_for
    type: string
  - name: cloud_obs
    type: float

# What the operator emits. These are the keys of the dictionary infer() returns.
#
#   prediction  mean power for the hour 24 h ahead, W
#   cloud_used  1.0 when a yr.no cloud value was available for that hour, else 0.0
outputs:
  - name: prediction
    type: float
  - name: cloud_used
    type: float

# Deployment configuration, matching CustomConfig in op.py.
config_values:
  - name: retrain_after_s
    type: int
